name: delsi-chews-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: delsi
      POSTGRES_PASSWORD: delsi_dev_only
      POSTGRES_DB: delsi_medusa
    ports:
      - "5432:5432"
    volumes:
      - delsi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delsi -d delsi_medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - delsi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  delsi_postgres_data:
  delsi_redis_data:
